<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fits the phone screen; viewport-fit=cover lets the gradient go behind the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#95A1BF">
  <title>Skin Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top: sunset gradient with the date and the last 7 days -->
  <header class="hero">
    <p class="micro" id="today-label"></p>
    <h1>Today</h1>
    <ol class="day-strip" id="day-strip" aria-label="Last 7 days"></ol>
  </header>

  <!-- White sheet that rises over the gradient -->
  <main class="sheet">
    <section class="streak" aria-live="polite">
      <p class="micro">Current streak</p>
      <div class="streak-number display" id="streak-number">0</div>
      <p class="streak-label" id="streak-label">days clear</p>
    </section>

    <div class="tiles">
      <div class="tile"><span class="micro">Best streak</span><strong id="tile-best">0</strong></div>
      <div class="tile"><span class="micro">Clear this month</span><strong id="tile-clear">0</strong></div>
      <div class="tile"><span class="micro">Breakouts this month</span><strong id="tile-breakouts">0</strong></div>
    </div>

    <!-- On a phone, capture="user" opens the front (selfie) camera -->
    <label class="button primary capture">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="camera-label">Log a breakout</span>
      <input class="camera-input" type="file" accept="image/*" capture="user" hidden>
    </label>

    <!-- Calendar -->
    <section class="card calendar">
      <div class="cal-header">
        <button id="prev-month" class="nav" aria-label="Previous month">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="month-title"></h2>
        <button id="next-month" class="nav" aria-label="Next month">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="cal-grid weekdays micro" aria-hidden="true">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div id="calendar" class="cal-grid"></div>
      <div class="legend micro">
        <span><i class="key clear"></i>Clear</span>
        <span><i class="key breakout"></i>Breakout</span>
        <span><i class="key none"></i>Not tracked</span>
      </div>
    </section>

    <p class="footnote">Photos are saved only on this phone. Nothing is uploaded.</p>
  </main>

  <!-- After taking a photo: look at it, then retake or save -->
  <dialog id="review" class="sheet-dialog">
    <p class="micro" id="review-date"></p>
    <h2>Keep this photo?</h2>
    <img id="review-photo" class="photo" alt="Photo you just took">
    <div class="dialog-buttons">
      <label class="button secondary">
        Retake
        <input class="camera-input" type="file" accept="image/*" capture="user" hidden>
      </label>
      <button id="review-save" class="button primary" autofocus>Save</button>
    </div>
    <button id="review-cancel" class="text-button">Cancel</button>
  </dialog>

  <!-- Viewing a saved day's photo -->
  <dialog id="viewer" class="sheet-dialog">
    <div class="photo-card">
      <img id="viewer-photo" class="photo" alt="Breakout photo">
      <div class="photo-date">
        <span class="display" id="viewer-day"></span>
        <span class="micro" id="viewer-month"></span>
      </div>
    </div>
    <div class="dialog-buttons">
      <button id="viewer-delete" class="button quiet">Delete</button>
      <button id="viewer-close" class="button primary" autofocus>Close</button>
    </div>
  </dialog>

  <script src="dates.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
