<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fits the phone screen; viewport-fit=cover lets the gradient go behind the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#95A1BF">
  <title>Skin Tracker</title>
  <!-- Lets it be added to the home screen and open full screen, like an app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Skin Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Screen 1: Today ===== -->
  <div id="screen-today" class="screen">
    <!-- Top: sunset gradient with the date and the last 7 days -->
    <header class="hero">
      <p class="micro" id="today-label"></p>
      <h1>Today</h1>
      <!-- Swipe sideways through every day; the middle one grows -->
      <ol class="day-strip" id="day-strip" aria-label="Your days"></ol>
      <button class="strip-caption" id="strip-caption" disabled></button>
    </header>

    <!-- White sheet that rises over the gradient -->
    <main class="sheet">
      <section class="streak" aria-live="polite">
        <p class="micro">Current streak</p>
        <div class="streak-number display" id="streak-number">0</div>
        <p class="streak-label" id="streak-label">days clear</p>
      </section>

      <!-- Tapping a tile opens the Calendar -->
      <div class="tiles">
        <a class="tile" href="#calendar"><span class="micro">Best streak</span><strong id="tile-best">0</strong></a>
        <a class="tile" href="#calendar"><span class="micro">Clear this month</span><strong id="tile-clear">0</strong></a>
        <a class="tile" href="#calendar"><span class="micro">Breakouts this month</span><strong id="tile-breakouts">0</strong></a>
      </div>

      <!-- On a phone this offers Take Photo or Photo Library -->
      <label class="button primary capture" tabindex="0" role="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span id="camera-label">Log a breakout</span>
        <input class="camera-input" type="file" accept="image/*" hidden>
      </label>

      <p class="footnote">Photos are saved only on this phone. Nothing is uploaded.</p>
    </main>
  </div>

  <!-- ===== Screen 2: Calendar ===== -->
  <div id="screen-calendar" class="screen" hidden>
    <header class="page-head">
      <p class="micro" id="since-label"></p>
      <div class="title-row">
        <h1>Calendar</h1>
        <!-- Add a photo from the Calendar (camera or photo library) -->
        <label class="add-photo" tabindex="0" role="button" aria-label="Add a photo">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <input class="camera-input" id="calendar-camera" type="file" accept="image/*" hidden>
        </label>
      </div>
      <!-- Notion-style view tabs, with the month range picker on the right -->
      <div class="view-tabs">
        <div role="tablist" aria-label="Calendar view">
          <button class="view-tab" role="tab" data-view="photos">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 2-2 5 5"/></svg>
            Photos
          </button>
          <button class="view-tab" role="tab" data-view="lines">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h9"/></svg>
            Lines
          </button>
        </div>
        <label class="range-picker">
          <span class="visually-hidden">Show</span>
          <span id="range-label" aria-hidden="true">Month</span>
          <!-- Invisible, on top of the label: tapping opens the phone's own picker -->
          <select id="range">
            <option value="month">Month</option>
            <option value="all">All months</option>
          </select>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </label>
      </div>
    </header>

    <main class="page">
      <div id="months"></div>
      <div id="legend" class="legend micro"></div>
    </main>
  </div>

  <!-- ===== Floating nav bar ===== -->
  <!-- The white pill slides to whichever screen is open -->
  <nav class="tabbar" id="tabbar" aria-label="Screens">
    <span class="tab-thumb" aria-hidden="true"></span>
    <a href="#today" class="tab" data-screen="today">Today</a>
    <a href="#calendar" class="tab" data-screen="calendar">Calendar</a>
  </nav>

  <!-- After taking a photo: look at it, then retake or save -->
  <dialog id="review" class="sheet-dialog">
    <!-- Which day the photo belongs to; change it for older photos from your library -->
    <label class="date-field">
      <span class="micro">Date</span>
      <input type="date" id="review-date">
    </label>
    <h2>Keep this photo?</h2>
    <img id="review-photo" class="photo" alt="Photo you just took">
    <div class="dialog-buttons">
      <label class="button secondary" tabindex="0" role="button">
        Change
        <input class="camera-input" type="file" accept="image/*" hidden>
      </label>
      <button id="review-save" class="button primary" autofocus>Save</button>
    </div>
    <button id="review-cancel" class="text-button">Cancel</button>
  </dialog>

  <!-- Full-screen photo with no buttons: tap to close, swipe for the next one -->
  <dialog id="focus" class="focus-dialog" aria-label="Photo, full screen">
    <img id="focus-photo" alt="Breakout photo, full screen" draggable="false">
  </dialog>

  <!-- Viewing a saved day's photo -->
  <dialog id="viewer" class="sheet-dialog">
    <div class="photo-card">
      <img id="viewer-photo" class="photo" alt="Breakout photo">
      <!-- Only shown when a day has more than one photo -->
      <div class="photo-pager" id="viewer-pager">
        <button class="nav" id="viewer-prev" aria-label="Previous photo">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="micro" id="viewer-count"></span>
        <button class="nav" id="viewer-next" aria-label="Next photo">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="photo-date">
        <span class="display" id="viewer-day"></span>
        <span class="micro" id="viewer-month"></span>
      </div>
    </div>
    <div class="dialog-buttons">
      <button id="viewer-delete" class="button quiet">Delete</button>
      <button id="viewer-close" class="button primary" autofocus>Close</button>
    </div>
  </dialog>

  <!-- Short messages, e.g. when a photo can't be opened -->
  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" hidden></button>
  </div>

  <script src="dates.js"></script>
  <script src="db.js"></script>
  <script src="zip.js"></script>
  <script src="app.js"></script>
</body>
</html>
